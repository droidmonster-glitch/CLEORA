services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cleora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cleora
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleora"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cleora:${POSTGRES_PASSWORD}@db:5432/cleora
      AREZKI_TOKEN: ${AREZKI_TOKEN:?Set AREZKI_TOKEN}
      SARAH_TOKEN: ${SARAH_TOKEN:?Set SARAH_TOKEN}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    profiles: ["automation"]
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n:/home/node/.n8n
volumes:
  db:
  n8n:
